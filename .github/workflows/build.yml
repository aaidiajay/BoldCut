name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|Could not|not found|Unresolved' -A2 build.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BoldCut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
